{% extends 'base.html' %}
{% load static %}

{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        <label class="snup" for="uname">Username</label>
        <input type="text" name="usrname" id="uname">
        <br><br>
        <label class="snup" for="fname">First Name</label>
        <input type="text" name="fname" id="fname">
        <br><br>
        <label class="snup" for="lname">Last Name</label>
        <input type="text" name="lname" id="lname">
        <br><br>
        <label class="snup" for="birthdate">Birthdate</label>
        <input type="date" name="usrbd" id="birthdate">
        <br><br>
        <label class="snup" for="pass">Password</label>
        <input type="password" name="usrpass" id="pass">
        <br><br>
        <button type="submit">Submit</button>
    </form>
{% endblock %}
